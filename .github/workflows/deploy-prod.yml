name: Deployment Production
on:
  workflow_call:
    inputs:
      environments:
        type: string
        description: An optional list of environments to deploy to.
        default: 'prod'
      workflow_type:
        type: string
        description: An optional string for workflow types.
        default: 'prod'
      branch:
        type: string
        description: An optional string to define which branch to checkout.
        default: 'master'
      current_version:
        type: string
        description: Current Version of the package.json.
        default: '0.0.0'
jobs:
  check-inputs:
    runs-on: 'nas'
    environment: ${{ inputs.environments }}
    steps:
      - name: Check secrets present
        run: |
          if [[ -z "${{ secrets.DOCKERHUB_USER }}" ]]; then
            echo "DOCKERHUB_USER secret is empty or missing"
            exit 1
          else
            echo "DOCKERHUB_USER secret is set"
          fi
          if [[ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            echo "DOCKERHUB_TOKEN secret is empty or missing"
            exit 1
          else
            echo "DOCKERHUB_TOKEN secret is set"
          fi
          echo "Current Version: ${{inputs.current_version}}"
  build:
    needs: check-inputs
    if: needs.check-inputs.result == 'success' && inputs.workflow_type == 'release' && false
    environment: ${{ inputs.environments }}
    runs-on: 'nas'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Branch Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
      - name: Create .env
        run: |
          touch .env
          echo DB_URL=${{ secrets.DB_URL }} >> .env
          echo SECRET=${{ secrets.SECRET }} >> .env
          echo REFRESH_SECRET=${{ secrets.REFRESH_SECRET }} >> .env
          cat .env
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: registry.rcslabs.dev
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker Build Backend
        run: docker build -f Dockerfile -t registry.rcslabs.dev/doble/mm-service:prod ./ --build-arg ENVIRONMENT=prod
      - name: Docker Push Backend
        run: docker push registry.rcslabs.dev/doble/mm-service:prod